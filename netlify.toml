[[redirects]]
from = "https://roadminded.fi/*"
to = "https://roadminded.com/fi/:splat"
status = 301
force = true

[[redirects]]
from = "http://roadminded.fi/*"
to = "https://roadminded.com/fi/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.roadminded.fi/*"
to = "https://roadminded.com/fi/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.roadminded.fi/*"
to = "https://roadminded.com/fi/:splat"
status = 301
force = true

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"